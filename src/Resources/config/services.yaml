parameters:
  acme_server_url: 'https://acme-staging-v02.api.letsencrypt.org/directory'

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Tourze\ACMEClientBundle\Controller\:
    resource: '../../Controller/'
  Tourze\ACMEClientBundle\Service\:
    resource: '../../Service/'
  Tourze\ACMEClientBundle\Repository\:
    resource: '../../Repository/'
  Tourze\ACMEClientBundle\Command\:
    resource: '../../Command/'
  Tourze\ACMEClientBundle\Command\Handler\:
    resource: '../../Command/Handler/'
    tags: ['acme_log_query.handler']

  # AcmeLogQueryCommand 需要特殊配置，手动注入所有 handlers
  Tourze\ACMEClientBundle\Command\AcmeLogQueryCommand:
    arguments:
      $handlers: !tagged_iterator acme_log_query.handler

  # 为特定服务配置 ACME 服务器 URL
  Tourze\ACMEClientBundle\Service\AcmeApiClient:
    arguments:
      $directoryUrl: '%acme_server_url%'

  Tourze\ACMEClientBundle\Service\AccountService:
    arguments:
      $acmeServerUrl: '%acme_server_url%'
